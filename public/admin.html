<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administration · Bio Star Monde Eden</title>
<meta name="theme-color" content="#26337F">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
  main{padding-block:20px 48px}
  .inner{max-width:880px}
  .top-in{max-width:912px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .stat b{font:800 1.5rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
  .item{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item img{max-width:220px;border-radius:10px;border:1px solid var(--line)}
  .list-card{padding:0 16px}
  .price-in{width:110px;min-height:40px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in gutter">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="m-bg" width="32" height="32" rx="9"/><path class="m-stem" d="M16 25v-9"/><path class="m-dark" d="M16 17c-4.5 0-7-2.7-7-7 4.5 0 7 2.7 7 7z"/><path class="m-light" d="M16 14c0-4.5 2.7-7 7-7 0 4.5-2.7 7-7 7z"/></svg>
      <div><p class="brand-name">Bio Star Monde Eden</p><p class="brand-sub">Administration de l'institut</p></div>
    </div>
    <a class="auth" href="/">Application</a>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>
<main class="gutter">
<div class="inner stack" id="root">
  <div class="card stack" id="login">
    <h1>Accès administrateur</h1>
    <p class="muted">Saisissez le jeton d'administration défini dans la variable ADMIN_TOKEN du serveur. Les administrateurs listés dans ADMIN_USERNAMES peuvent aussi entrer après connexion Pi dans l'application.</p>
    <form id="login-form" class="stack" novalidate>
      <div class="field"><label for="tok">Jeton d'administration</label><input id="tok" class="input" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Entrer</button>
    </form>
  </div>
  <div id="dash" class="stack" hidden></div>
</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/admin.js"></script>
</body>
</html>
